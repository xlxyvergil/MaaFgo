name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
      platform:
        description: Platforms to upload (choose android when backfilling APKs)
        type: choice
        default: all
        options: [all, android, win]
  release:
    types: [released]

jobs:
  mirrorchyan:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'xlxyvergil' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x86_64
            filename: MaaFgo-win-x86_64-*-MXU.zip
            rid: MaaFgo
          - os: android
            arch: arm64
            filename: MaaFGO-android-arm64-v8a-v*.apk
            rid: MaaFgo_exec
          - os: android
            arch: amd64
            filename: MaaFGO-android-x86_64-v*.apk
            rid: MaaFgo_exec
    steps:
      - name: Resolve release tag and Android channel
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.os }}
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            release_tag=$(gh release view "$RELEASE_TAG" --repo xlxyvergil/MaaFgo --json tagName --jq .tagName)
          else
            release_tag=$(gh release view --repo xlxyvergil/MaaFgo --json tagName --jq .tagName)
          fi
          test -n "$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          # 安卓只有 stable / beta 两档，alpha、rc 等预发布也归入 beta。
          channel=stable
          if [[ "$release_tag" =~ -(alpha|beta|rc|dev|ci)([.-]|$) ]]; then
            channel=beta
          fi
          echo "android_channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: MirrorChyan/uploading-action@v1
        if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == matrix.os }}
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ${{ matrix.rid }}
          tag: ${{ steps.release.outputs.tag }}
          # APK 直接分发，不套 ZIP；Windows 仍沿用上传 action 的渠道判定。
          extra_zip: "false"
          channel: ${{ matrix.os == 'android' && steps.release.outputs.android_channel || '' }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: xlxyvergil
          repo: MaaFgo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 原 token 获得新资源授权后可复用，也可为 APK 单独配置 token。
          upload_token: ${{ matrix.os == 'android' && (secrets.MirrorChyanExecUploadToken || secrets.MirrorChyanUploadToken) || secrets.MirrorChyanUploadToken }}
