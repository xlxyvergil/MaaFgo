name: build-android-apk

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Build and verify APKs with the production signing key
        type: boolean
        default: false
  pull_request:
    paths:
      - "Android/**"
      - "agent/**"
      - "assets/**"
      - "tools/*android*.py"
      - "tests/test_android*.py"
      - "tests/android/**"
      - ".github/workflows/android.yml"
  # 与 MXU 一致：普通分支 push 不打包；v* tag 由 install.yml 调用本流程发布。

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_BUILD_TYPE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release) && 'release' || 'debug' }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          # 默认包列表包含已不可用的旧 tools，这里只安装当前需要的平台工具。
          packages: 'platform-tools'
      - name: Install SDK and NDK
        run: |
          ndk=$(python -c 'import json; print(json.load(open("Android/versions.json"))["ndk"])')
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;$ndk"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Android/.cache
            Android/MaaFwApp/.maafw
            Android/MaaFwApp/.maa-cache
          key: android-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Android/versions.json', 'tools/build_android_opencv.py', 'Android/MaaFwApp') }}
      - name: Check Android regressions
        run: |
          python -m pip install numpy opencv-python-headless onnxruntime
          python -m unittest discover -s tests -p 'test_android*.py' -v
      - name: Restore release signing key
        if: env.APK_BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          umask 077
          key_path=$(mktemp "$RUNNER_TEMP/maafgo-release-XXXXXX")
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
      - name: Build debug APK
        if: env.APK_BUILD_TYPE == 'debug'
        env:
          BUILD_ABI: ${{ matrix.abi }}
          # 下载器读取此环境变量，以认证方式查询 MaaFramework Release。
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_android.py --abi "$BUILD_ABI"
      - name: Build signed release APK
        if: env.APK_BUILD_TYPE == 'release'
        env:
          BUILD_ABI: ${{ matrix.abi }}
          GITHUB_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python tools/build_android.py --abi "$BUILD_ABI" --release
      - name: Verify release signature and APK metadata
        if: env.APK_BUILD_TYPE == 'release'
        env:
          BUILD_ABI: ${{ matrix.abi }}
        run: |
          args=(--abi "$BUILD_ABI" --report "Android/out/release-verification-${BUILD_ABI}.json")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python tools/check_android_release.py "Android/out/MaaFGO-android-${BUILD_ABI}-release.apk" "${args[@]}"
      - name: Check PI with Android parser and run-plan builder
        # 上游只提供 debug JVM 测试；实际 Release APK 已在上一步单独校验。
        run: python tools/check_android_interface.py
      - name: Check Android shell fixes
        working-directory: Android/MaaFwApp
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          --tests 'com.aliothmoon.maafw.project.PiInstaller*'
          --tests 'com.aliothmoon.maafw.overlay.screensaver.ScreenSaver*Test'
          --tests 'com.aliothmoon.maafw.settings.SettingsViewModelTest'
          --tests 'com.aliothmoon.maafw.remote.MaaRunnerControllerTargetTest'
          --tests 'com.aliothmoon.maafw.remote.internal.ActivityStartFailureTest'
          --tests 'com.aliothmoon.maafw.remote.internal.ActivityLaunchCancellationTest'
          --tests 'com.aliothmoon.maafw.remote.internal.AppWatchdogTargetTest'
          --tests 'com.aliothmoon.maafw.remote.internal.DisplayPinStabilityTest'
          --tests 'com.aliothmoon.maafw.remote.internal.TaskDisplayMoveTargetTest'
          --tests 'com.aliothmoon.maafw.runner.ForegroundDisplayPrecheckTest'
          --tests 'com.aliothmoon.maafw.remote.internal.PrimaryInputGuardTest'
          --tests 'com.aliothmoon.maafw.bridge.DriverPrimaryInputGuardTest'
          --tests 'com.aliothmoon.maafw.bridge.InputControlGestureDisplayTest'
          --tests 'com.aliothmoon.maafw.runner.MaaFrameworkRunnerPortTest'
      - uses: actions/upload-artifact@v7
        with:
          name: MaaFGO-android-${{ matrix.abi }}-${{ env.APK_BUILD_TYPE }}
          path: Android/out/MaaFGO-android-${{ matrix.abi }}-${{ env.APK_BUILD_TYPE }}.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload release verification
        if: env.APK_BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: MaaFGO-android-${{ matrix.abi }}-release-verification
          path: Android/out/release-verification-${{ matrix.abi }}.json
          if-no-files-found: error
      - name: Remove release signing key
        if: always() && env.APK_BUILD_TYPE == 'release'
        run: |
          if [[ -n "${KEYSTORE_PATH:-}" ]]; then
            case "$KEYSTORE_PATH" in
              "$RUNNER_TEMP"/maafgo-release-*) rm -f -- "$KEYSTORE_PATH" ;;
              *) echo "::error::Unexpected signing key path"; exit 1 ;;
            esac
          fi
