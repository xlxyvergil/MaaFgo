name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "maatools.config.mts"
      - "assets/**"
      - "**.py"
      - "tests/**"
      - "deps/tools/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "maatools.config.mts"
      - "assets/**"
      - "**.py"
      - "tests/**"
      - "deps/tools/**"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [unit, component]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-0
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run regression suite
        run: python tools/run_tests.py --suite ${{ matrix.suite }}
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MaaFramework system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-0

      - name: Run maa-checker
        run: |
          npm ci
          # 工具会吞掉 MaaFramework 下载/解包错误，只返回退出码；有限重试网络波动。
          # 资源本身有错误时三次均会失败，绝不将失败作为检查通过。
          for attempt in 1 2 3; do
            if npx --yes @nekosu/maa-tools@1.1.3 check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::maa-checker 第 ${attempt} 次失败，5 秒后重试；若仅输出 preparing maafw，请检查依赖下载。"
              sleep 5
            fi
          done
          echo "::error::maa-checker 连续三次失败，请检查上方资源错误或 MaaFramework 下载日志。"
          exit 1

      - name: Install maafw
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade maafw --pre

      - name: Validate JSON Schema
        if: ${{ !cancelled() }}
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json --task-dirs assets/tasks assets/options --require-tracked-imports
